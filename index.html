<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/branding/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ontime! - Portal Akademik Gamified untuk mahasiswa. Kelola tugas, jadwal, dan proses belajar dengan pengalaman gaming yang seru."
    />
    <title>ontime! - Portal Akademik Gamified</title>

    <!-- Google Fonts: Orbitron (display) & Rajdhani (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Press+Start+2P&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
    
    <!-- Google Identity Services & GAPI Client -->
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <!-- Background mesh pattern -->
    <div class="mesh-bg">
      <div
        class="mesh-blob"
        style="width: 600px; height: 600px; top: -10%; left: 10%; background: rgba(0, 240, 255, 0.08)"
      >
      </div>
      <div
        class="mesh-blob"
        style="width: 500px; height: 500px; top: 50%; right: -5%; background: rgba(255, 0, 255, 0.06); animation-delay: -8s"
      >
      </div>
      <div
        class="mesh-blob"
        style="width: 400px; height: 400px; bottom: -5%; left: 30%; background: rgba(255, 215, 0, 0.05); animation-delay: -15s"
      >
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
